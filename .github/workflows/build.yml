name: Build and Pack Plugin

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Repository klonen
      uses: actions/checkout@v4

    - name: Java 21 einrichten
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '21'
        cache: 'maven'

    - name: Ordnerstruktur erstellen und Dateien verschieben
      run: |
        # Erstelle die benötigten Maven-Ordner
        mkdir -p src/main/java/de/powersmp/powertools
        mkdir -p src/main/resources

        # Verschiebe Java-Datei an den richtigen Ort (falls im Root vorhanden)
        if [ -f "PowerTools.java" ]; then
          mv PowerTools.java src/main/java/de/powersmp/powertools/
        fi

        # Verschiebe plugin.yml und config.yml in den resources-Ordner
        if [ -f "plugin.yml" ]; then
          mv plugin.yml src/main/resources/
        fi
        if [ -f "config.yml" ]; then
          mv config.yml src/main/resources/
        fi

    - name: Mit Maven bauen und JAR packen
      run: mvn clean package

    - name: Fertige JAR-Datei als Artefakt speichern
      uses: actions/upload-artifact@v4
      with:
        name: PowerTools-v11-Plugin
        path: target/*.jar
